<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모여라! 우리들 - 스마트 약속 조율</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- 파이어베이스 및 카카오맵 도구 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <!-- 카카오맵 API (보내주신 키 적용 / 주소 검색 서비스 추가) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=a3af4e8999293e0dfe43a0bd1831c944&libraries=services"></script>

    <style>
        :root { --main-mint: #3FAE85; --main-orange: #F0854B; --text-brown: #5B4636; }
        body { margin: 0; background: #FBE9D0; font-family: 'Gowun Dodum', sans-serif; color: var(--text-brown); display: flex; justify-content: center; min-height: 100vh; }
        .jua { font-family: 'Jua', sans-serif; }
        .app-container { width: 100%; max-width: 412px; height: 840px; background: #FFFDF8; border-radius: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .page { display: none; width: 100%; height: 100%; flex-direction: column; padding: 24px; overflow-y: auto; }
        .page.active { display: flex; }
        .btn-primary { background: var(--main-mint); color: white; border-radius: 20px; padding: 18px; text-align: center; font-family: 'Jua'; font-size: 18px; cursor: pointer; border: none; width: 100%; margin-top: auto; flex-shrink: 0; }
        
        .selectable { cursor: pointer; border: 2px solid #F3EADA; border-radius: 20px; transition: 0.2s; background: white; }
        .selected { border-color: var(--main-mint) !important; background: #F0F9F6 !important; }
        
        /* 캘린더 */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .date-cell { aspect-ratio: 1/1; display: flex; items-center; justify-content: center; font-size: 12px; font-weight: bold; border-radius: 50%; cursor: pointer; }
        .date-cell.active-date { background: var(--main-mint) !important; color: white !important; }
        
        /* 맛집 카드 디자인 강화 */
        .place-card { padding: 16px; border: 2px solid #F3EADA; border-radius: 24px; background: white; cursor: pointer; margin-bottom: 12px; display: flex; gap: 14px; align-items: flex-start; transition: 0.2s; }
        .place-card.selected { border-color: var(--main-mint); background: #F0F9F6; box-shadow: 0 8px 16px rgba(63, 174, 133, 0.1); }
        .place-thumb { width: 64px; height: 64px; background: #FBF3E7; border-radius: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 32px; }
        
        /* 지도 컨테이너 */
        #map { width: 100%; height: 240px; border-radius: 28px; border: 2px solid #F3EADA; flex-shrink: 0; margin-bottom: 16px; background: #eee; }

        .finalize-btn { background: white; border: 1px solid #F3EADA; padding: 12px 16px; border-radius: 16px; font-size: 11px; text-align: left; cursor: pointer; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .finalize-btn:hover { background: #F0F9F6; border-color: var(--main-mint); }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 1. 홈 & 프로필 -->
    <div id="page-home" class="page active items-center justify-center text-center">
        <div class="text-8xl mb-8 animate-bounce">🐱</div>
        <h1 class="jua text-3xl mb-4 text-[#5B4636]">모여라! 우리들</h1>
        <button class="btn-primary" onclick="goToPage('profile-setup')">➕ 약속 방 만들기</button>
    </div>

    <div id="page-profile-setup" class="page items-center justify-center text-center">
        <h2 class="jua text-2xl mb-8">내 프로필 만들기 ✨</h2>
        <div id="profile-preview" class="w-20 h-20 text-4xl mb-6 rounded-full flex items-center justify-center mx-auto" style="background-color: #FFE0C7;">🐱</div>
        <input type="text" id="user-name" placeholder="이름을 입력해주세요" class="w-full p-4 border-2 border-[#F3EADA] rounded-2xl mb-10 text-center focus:outline-none focus:border-[#3FAE85]">
        <button class="btn-primary" onclick="handleEntry()">입장하기 🐾</button>
    </div>

    <!-- Phase 1: 날짜 및 시간 투표 -->
    <div id="page-datetime" class="page">
        <h2 class="jua text-2xl mb-6">언제가 좋아? 🗓️</h2>
        <div class="bg-white border-2 border-[#F3EADA] rounded-[32px] p-5 mb-6 text-center shadow-sm">
            <div class="flex justify-between items-center mb-5 px-2">
                <button onclick="changeMonth(-1)" class="text-xl font-bold text-gray-300">‹</button>
                <div id="calendar-month" class="jua text-lg">2024년 10월</div>
                <button onclick="changeMonth(1)" class="text-xl font-bold text-gray-300">›</button>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
        </div>
        <div class="mb-4">
            <p class="text-[11px] font-bold text-[#B3A18F] mb-3 uppercase tracking-widest">시간대 선택 (중복 가능)</p>
            <div class="grid grid-cols-3 gap-3 mb-4">
                <div class="selectable p-3 text-center" id="btn-lunch" onclick="toggleTimeCategory('점심')">☀️<br><span class="jua text-[12px]">점심</span></div>
                <div class="selectable p-3 text-center" id="btn-after" onclick="toggleTimeCategory('오후')">☕<br><span class="jua text-[12px]">오후</span></div>
                <div class="selectable p-3 text-center" id="btn-dinner" onclick="toggleTimeCategory('저녁')">🌙<br><span class="jua text-[12px]">저녁</span></div>
            </div>
            <div id="detail-time-area" class="flex flex-wrap gap-2 mb-4"></div>
        </div>
        <button class="btn-primary" onclick="submitToWaiting()">의견 제출하고 대기하기 🗳️</button>
    </div>

    <!-- 대기실 (방장 확정) -->
    <div id="page-waiting" class="page">
        <h2 class="jua text-2xl mb-2 text-center">친구들을 기다려요 💬</h2>
        <p class="text-center text-[11px] text-gray-400 mb-6">투표 현황을 실시간으로 확인하세요!</p>
        <div class="bg-white border-2 border-[#F3EADA] rounded-[32px] p-6 mb-6 shadow-sm">
            <div id="member-list" class="grid grid-cols-3 gap-4 mb-2"></div>
        </div>
        <div id="admin-panel" class="hidden">
            <div class="bg-[#F0FDF4] border-2 border-[#BBF7D0] rounded-[24px] p-5 mb-4">
                <p class="jua text-[#166534] mb-3 text-sm">👑 방장님! 약속 일시를 확정해주세요</p>
                <div id="vote-summary-list" class="max-h-48 overflow-y-auto pr-1"></div>
            </div>
        </div>
        <div id="guest-panel" class="text-center p-8 bg-gray-50 rounded-[24px] mb-4">
            <p class="text-xs text-gray-400 leading-relaxed">방장님이 일시를 확정할 때까지<br>잠시만 기다려주세요! 🐾</p>
        </div>
        <button class="bg-[#FFE39A] p-4 rounded-2xl text-center cursor-pointer mb-2 border-none w-full font-bold text-[#8A6A50]" onclick="copyLink()">🔗 초대 링크 복사하기</button>
    </div>

    <!-- Phase 2: 메뉴 & 장소 검색 -->
    <div id="page-menu" class="page">
        <div class="bg-[#F0FDF4] p-5 rounded-[24px] mb-8 text-center border-2 border-[#BBF7D0]">
            <p class="text-[10px] font-bold text-[#3FAE85] uppercase tracking-widest mb-1">Confirmed Time</p>
            <p class="jua text-base text-[#166534]" id="final-confirmed-time">-</p>
        </div>
        <h2 class="jua text-2xl mb-6">뭐 먹을까? 🍕</h2>
        <div class="grid grid-cols-2 gap-3 mb-6" id="menu-list">
            <div class="selectable p-4 text-center jua" onclick="selectMenu(this, '한식')">🍚 한식</div>
            <div class="selectable p-4 text-center jua" onclick="selectMenu(this, '일식')">🍣 일식</div>
            <div class="selectable p-4 text-center jua" onclick="selectMenu(this, '양식')">🍝 양식</div>
            <div class="selectable p-4 text-center jua" onclick="selectMenu(this, '카페')">🍰 카페</div>
        </div>
        <p class="text-[11px] font-bold text-[#B3A18F] mb-3 uppercase tracking-wider">어디 근처에서 볼까?</p>
        <input type="text" id="search-location" placeholder="예: 강남역, 성수동 등" class="w-full p-4 border-2 border-[#F3EADA] rounded-2xl mb-6 text-center focus:outline-none focus:border-[#3FAE85]">
        <button class="btn-primary" onclick="searchPlaces()">맛집 리스트 불러오기 ✨</button>
    </div>

    <!-- 장소 투표 -->
    <div id="page-vote" class="page">
        <h2 class="jua text-2xl mb-4">장소 정하기! 📍</h2>
        <div id="map"></div>
        <div id="place-list" class="flex-1 overflow-y-auto pr-1">
             <div class="text-center py-10 text-gray-300">검색 중...</div>
        </div>
        <button class="btn-primary" onclick="finishVote()">최종 투표 마감! 🎫</button>
    </div>

    <!-- 티켓 -->
    <div id="page-ticket" class="page items-center justify-center">
        <div class="bg-white rounded-[40px] shadow-2xl w-full p-10 text-center border-2 border-[#F3EADA] animate-slide-up">
            <h2 class="jua text-3xl text-[#3FAE85] mb-6">모임 티켓 🎫</h2>
            <div id="ticket-info" class="space-y-4 jua"></div>
        </div>
        <button class="btn-primary mt-10" onclick="location.href='/'">처음으로</button>
    </div>
</div>

<script>
    // Firebase 설정
    const firebaseConfig = {
        apiKey: "AIzaSyBqrEr1J2isB6NpoK_ONxOgmyl_cvNAnVs",
        authDomain: "moyeora-75ccf.firebaseapp.com",
        projectId: "moyeora-75ccf",
        storageBucket: "moyeora-75ccf.firebasestorage.app",
        messagingSenderId: "740093064639",
        appId: "1:740093064639:web:bd5326613a98aa2ea9dd0a",
        measurementId: "G-ZCEJ9CPWQV"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let myRoomId = new URLSearchParams(window.location.search).get('room');
    let viewYear = new Date().getFullYear();
    let viewMonth = new Date().getMonth();
    let myInfo = { name: "", emoji: "🐱", color: "#FFE0C7" };
    let mySelection = { dates: [], times: [], menu: "", place: "", address: "" };

    // 페이지 전환
    function goToPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        const target = document.getElementById('page-' + id);
        if(target) target.classList.add('active');
        if(id === 'datetime') renderCalendar();
    }

    // 입장 로직
    async function handleEntry() {
        myInfo.name = document.getElementById('user-name').value || "말랑이";
        if (!myRoomId) {
            myRoomId = Math.random().toString(36).substring(2, 8).toUpperCase();
            await db.collection("rooms").doc(myRoomId).set({ 
                status: 'voting', 
                participants: [myInfo],
                adminName: myInfo.name,
                confirmedSlot: null
            });
            window.history.pushState({}, '', `?room=${myRoomId}`);
        } else {
            await db.collection("rooms").doc(myRoomId).update({ participants: firebase.firestore.FieldValue.arrayUnion(myInfo) });
        }
        startMonitoring();
        goToPage('datetime');
    }

    // 실시간 모니터링
    function startMonitoring() {
        db.collection("rooms").doc(myRoomId).onSnapshot((doc) => {
            const data = doc.data();
            if(!data) return;

            const listDiv = document.getElementById('member-list');
            listDiv.innerHTML = data.participants.map(p => `<div class="flex flex-col items-center"><div class="w-10 h-10 rounded-full flex items-center justify-center text-xl shadow-sm mb-1" style="background:${p.color}">${p.emoji}</div><span class="text-[8px] font-bold">${p.name}</span></div>`).join('');

            if (data.adminName === myInfo.name) {
                document.getElementById('admin-panel').classList.remove('hidden');
                document.getElementById('guest-panel').classList.add('hidden');
                renderAdminVoteSummary();
            }

            if (data.status === 'place_voting' && data.confirmedSlot) {
                document.getElementById('final-confirmed-time').innerText = data.confirmedSlot;
                goToPage('menu');
            }

            if (data.status === 'finished') {
                document.getElementById('ticket-info').innerHTML = `<div class="text-gray-400 text-xs">일시</div><div>${data.confirmedSlot}</div><div class="text-gray-400 text-xs mt-4">장소</div><div class="text-orange-400">${data.finalPlace}</div><div class="text-[10px] text-gray-300 mt-1">${data.finalAddr}</div>`;
                goToPage('ticket');
            }
        });
    }

    function renderAdminVoteSummary() {
        const list = document.getElementById('vote-summary-list');
        list.innerHTML = "";
        mySelection.dates.forEach(d => {
            mySelection.times.forEach(t => {
                const btn = document.createElement('div');
                btn.className = "finalize-btn";
                btn.innerHTML = `<span class="jua text-gray-600">${d} (${t})</span> <span class="text-[#3FAE85] font-bold text-[10px]">확정하기 ></span>`;
                btn.onclick = () => finalizeSlot(d, t);
                list.appendChild(btn);
            });
        });
    }

    async function finalizeSlot(d, t) {
        await db.collection("rooms").doc(myRoomId).update({ status: 'place_voting', confirmedSlot: `${d} (${t})` });
    }

    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        document.getElementById('calendar-month').innerText = `${viewYear}년 ${viewMonth + 1}월`;
        grid.innerHTML = "";
        const firstDay = new Date(viewYear, viewMonth, 1).getDay();
        const lastDate = new Date(viewYear, viewMonth + 1, 0).getDate();
        for(let i=0; i<firstDay; i++) grid.innerHTML += `<div></div>`;
        for(let d=1; d<=lastDate; d++) {
            const dateStr = `${viewYear}-${viewMonth+1}-${d}`;
            const cell = document.createElement('div');
            cell.className = "date-cell" + (mySelection.dates.includes(dateStr) ? " active-date" : "");
            cell.innerText = d;
            cell.onclick = () => {
                if(mySelection.dates.includes(dateStr)) mySelection.dates = mySelection.dates.filter(v => v !== dateStr);
                else mySelection.dates.push(dateStr);
                renderCalendar();
            };
            grid.appendChild(cell);
        }
    }
    function changeMonth(s) { viewMonth+=s; if(viewMonth<0){viewMonth=11;viewYear--;} if(viewMonth>11){viewMonth=0;viewYear++;} renderCalendar(); }
    
    function toggleTimeCategory(cat) {
        document.querySelectorAll('#page-datetime .selectable').forEach(b => b.classList.remove('selected'));
        document.getElementById('btn-'+(cat==='점심'?'lunch':cat==='오후'?'after':'dinner')).classList.add('selected');
        const area = document.getElementById('detail-time-area'); area.innerHTML = "";
        const hS = cat==='점심'?11:(cat==='오후'?14:18), hE = cat==='점심'?14:(cat==='오후'?17:22);
        for(let h=hS; h<=hE; h++) {
            [`${h}:00`, `${h}:30`].forEach(t => {
                const chip = document.createElement('div');
                chip.className = "time-chip" + (mySelection.times.includes(t) ? " active-time" : "");
                chip.innerText = t;
                chip.onclick = () => {
                    if(mySelection.times.includes(t)) mySelection.times = mySelection.times.filter(v=>v!==t);
                    else mySelection.times.push(t);
                    toggleTimeCategory(cat);
                };
                area.appendChild(chip);
            });
        }
    }

    function submitToWaiting() { if(!mySelection.dates.length || !mySelection.times.length) return alert("날짜와 시간을 선택하세요!"); goToPage('waiting'); }

    // 맛집 검색
    function selectMenu(el, m) { document.querySelectorAll('#menu-list .selectable').forEach(s => s.classList.remove('selected')); el.classList.add('selected'); mySelection.menu = m; }
    
    let ps = new kakao.maps.services.Places();
    let map, marker;

    function searchPlaces() {
        const loc = document.getElementById('search-location').value;
        if(!mySelection.menu || !loc) return alert("메뉴와 지역을 모두 입력하세요!");

        // 먼저 페이지 이동
        goToPage('vote');

        // 카카오 검색 실행
        ps.keywordSearch(`${loc} ${mySelection.menu}`, (data, status) => {
            if (status === kakao.maps.services.Status.OK) {
                // 약간의 지연시간을 두어 페이지가 완전히 뜬 후 지도 렌더링
                setTimeout(() => displayPlaces(data), 100);
            } else {
                alert("검색 결과가 없어요!");
                goToPage('menu');
            }
        });
    }

    function displayPlaces(places) {
        const listEl = document.getElementById('place-list');
        listEl.innerHTML = "";
        
        // 지도 초기화
        const first = places[0];
        const mapContainer = document.getElementById('map');
        map = new kakao.maps.Map(mapContainer, { center: new kakao.maps.LatLng(first.y, first.x), level: 3 });
        marker = new kakao.maps.Marker({ position: map.getCenter() });
        marker.setMap(map);

        places.forEach((p) => {
            let emoji = "🍴";
            if(p.category_name.includes("카페")) emoji = "☕";
            else if(p.category_name.includes("한식")) emoji = "🍚";
            else if(p.category_name.includes("일식")) emoji = "🍣";
            else if(p.category_name.includes("양식")) emoji = "🍝";

            const card = document.createElement('div');
            card.className = "place-card";
            card.innerHTML = `
                <div class="place-thumb">${emoji}</div>
                <div class="flex-1">
                    <div class="font-bold text-[13px] mb-0.5 text-[#5B4636]">${p.place_name}</div>
                    <div class="text-[10px] text-gray-400 mb-1 leading-tight">${p.address_name}</div>
                    <div class="flex justify-between items-center mt-2">
                         <span class="text-[9px] text-[#3FAE85] font-bold">${p.category_name.split(' > ').pop()}</span>
                         <a href="https://place.map.kakao.com/${p.id}" target="_blank" class="text-[9px] bg-gray-100 px-2 py-1 rounded-md text-gray-500">운영시간 확인 🔗</a>
                    </div>
                </div>
            `;
            card.onclick = () => {
                document.querySelectorAll('.place-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                mySelection.place = p.place_name;
                mySelection.address = p.address_name;
                const latLon = new kakao.maps.LatLng(p.y, p.x);
                map.panTo(latLon);
                marker.setPosition(latLon);
            };
            listEl.appendChild(card);
        });
    }

    async function finishVote() {
        if(!mySelection.place) return alert("장소를 골라주세요!");
        await db.collection("rooms").doc(myRoomId).update({ status: 'finished', finalPlace: mySelection.place, finalAddr: mySelection.address });
    }

    function copyLink() { navigator.clipboard.writeText(window.location.href); alert("링크가 복사되었습니다!"); }

    if(myRoomId) goToPage('profile-setup');
</script>

</body>
</html>
