<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모여라! 우리들 - 스마트 약속 조율</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=a3af4e8999293e0dfe43a0bd1831c944&libraries=services"></script>

    <style>
        :root { --main-mint: #3FAE85; --main-orange: #F0854B; --text-brown: #5B4636; }
        body { margin: 0; background: #FBE9D0; font-family: 'Gowun Dodum', sans-serif; color: var(--text-brown); display: flex; justify-content: center; min-height: 100vh; }
        .jua { font-family: 'Jua', sans-serif; }
        .app-container { width: 100%; max-width: 412px; height: 840px; background: #FFFDF8; border-radius: 36px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .page { display: none; width: 100%; height: 100%; flex-direction: column; padding: 24px; overflow-y: auto; }
        .page.active { display: flex; }
        .btn-primary { background: var(--main-mint); color: white; border-radius: 20px; padding: 18px; text-align: center; font-family: 'Jua'; font-size: 18px; cursor: pointer; border: none; width: 100%; margin-top: auto; flex-shrink: 0; }
        
        .selectable { cursor: pointer; border: 2px solid #F3EADA; border-radius: 20px; transition: 0.2s; background: white; }
        .selected { border-color: var(--main-mint) !important; background: #F0F9F6 !important; }
        
        /* 캘린더 */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .date-cell { aspect-ratio: 1/1; display: flex; items-center; justify-content: center; font-size: 12px; font-weight: bold; border-radius: 50%; cursor: pointer; }
        .date-cell.active-date { background: var(--main-mint) !important; color: white !important; }
        
        /* 시간 칩 */
        .time-chip { padding: 8px 14px; border-radius: 12px; border: 1px solid #F3EADA; font-size: 11px; cursor: pointer; background: white; }
        .time-chip.active-time { background: var(--main-orange); color: white; border-color: var(--main-orange); }
        .summary-chip { background: #F0F9F6; color: var(--main-mint); padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: bold; border: 1px solid var(--main-mint); }

        /* 지도 및 맛집 카드 */
        #map { width: 100%; height: 220px; border-radius: 24px; border: 2px solid #F3EADA; flex-shrink: 0; margin-bottom: 16px; }
        .place-card { padding: 16px; border: 2px solid #F3EADA; border-radius: 24px; background: white; cursor: pointer; margin-bottom: 12px; display: flex; gap: 12px; align-items: center; }
        .place-card.selected { border-color: var(--main-mint); background: #F0F9F6; }
        .place-thumb { width: 60px; height: 60px; background: #f7f7f7; border-radius: 16px; flex-shrink: 0; display: flex; items-center; justify-content: center; font-size: 30px; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 1. 홈 & 프로필 -->
    <div id="page-home" class="page active items-center justify-center text-center">
        <div class="text-8xl mb-8">🐱</div>
        <h1 class="jua text-3xl mb-4">모여라! 우리들</h1>
        <button class="btn-primary" onclick="goToPage('profile-setup')">➕ 약속 방 만들기</button>
    </div>

    <div id="page-profile-setup" class="page items-center justify-center text-center">
        <h2 class="jua text-2xl mb-8">내 프로필 만들기 ✨</h2>
        <div id="profile-preview" class="w-24 h-24 text-5xl mb-6 rounded-full flex items-center justify-center mx-auto" style="background-color: #FFE0C7;">🐱</div>
        <input type="text" id="user-name" placeholder="이름을 입력해주세요" class="w-full p-4 border-2 border-[#F3EADA] rounded-2xl mb-10 text-center focus:outline-none">
        <button class="btn-primary" onclick="handleEntry()">입장하기 🐾</button>
    </div>

    <!-- Phase 1: 날짜 및 시간 조율 -->
    <div id="page-datetime" class="page">
        <h2 class="jua text-2xl mb-6">언제가 좋아? 🗓️</h2>
        <div class="bg-white border-2 border-[#F3EADA] rounded-[32px] p-5 mb-6 text-center shadow-sm">
            <div class="flex justify-between items-center mb-5 px-2">
                <button onclick="changeMonth(-1)" class="text-xl font-bold text-gray-300">‹</button>
                <div id="calendar-month" class="jua text-lg">2024년 10월</div>
                <button onclick="changeMonth(1)" class="text-xl font-bold text-gray-300">›</button>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
        </div>
        <div class="mb-4">
            <p class="text-[11px] font-bold text-[#B3A18F] mb-3 uppercase">시간대 (중복 선택)</p>
            <div class="grid grid-cols-3 gap-3 mb-4">
                <div class="selectable p-3 text-center" id="btn-lunch" onclick="toggleTimeCategory('점심')">☀️<br><span class="jua text-[12px]">점심</span></div>
                <div class="selectable p-3 text-center" id="btn-after" onclick="toggleTimeCategory('오후')">☕<br><span class="jua text-[12px]">오후</span></div>
                <div class="selectable p-3 text-center" id="btn-dinner" onclick="toggleTimeCategory('저녁')">🌙<br><span class="jua text-[12px]">저녁</span></div>
            </div>
            <div id="detail-time-area" class="flex flex-wrap gap-2 mb-4"></div>
            <div id="selected-summary" class="flex flex-wrap gap-1 border-t pt-3 border-dashed"></div>
        </div>
        <button class="btn-primary" onclick="saveDateTime()">내 의견 제출하기 🗳️</button>
    </div>

    <!-- 대기실: 방장만 '확정' 버튼 보임 -->
    <div id="page-waiting" class="page">
        <h2 class="jua text-2xl mb-6 text-center">친구들을 기다려요 💬</h2>
        <div class="bg-white border-2 border-[#F3EADA] rounded-[32px] p-8 mb-6 shadow-sm">
            <div id="member-list" class="grid grid-cols-3 gap-6 mb-6"></div>
            <p class="text-xs text-center text-gray-400">모든 친구들이 투표할 때까지 잠시만 기다려주세요!</p>
        </div>
        <div id="admin-controls" class="hidden flex flex-col gap-3">
            <p class="text-xs font-bold text-orange-400 text-center">방장님! 날짜가 정해졌다면?</p>
            <button class="btn-primary" style="background-color: var(--main-orange);" onclick="confirmDateTime()">날짜 확정 & 장소 고르러 가기 🔥</button>
        </div>
    </div>

    <!-- Phase 2: 메뉴 및 진짜 맛집 검색 -->
    <div id="page-menu" class="page">
        <div class="bg-[#F0FDF4] p-4 rounded-2xl mb-6 text-center">
            <p class="text-[11px] font-bold text-[#3FAE85]">확정된 일시</p>
            <p class="jua text-sm" id="confirmed-time-display">-</p>
        </div>
        <h2 class="jua text-2xl mb-6">뭐 먹을까? 🍕</h2>
        <div class="grid grid-cols-2 gap-3 mb-6" id="menu-list">
            <div class="selectable p-4 text-center jua" onclick="selectMenu(this, '한식')">🍚 한식</div>
            <div class="selectable p-4 text-center jua" onclick="selectMenu(this, '일식')">🍣 일식</div>
            <div class="selectable p-4 text-center jua" onclick="selectMenu(this, '양식')">🍝 양식</div>
            <div class="selectable p-4 text-center jua" onclick="selectMenu(this, '카페')">🍰 카페</div>
        </div>
        <p class="text-[11px] font-bold text-[#B3A18F] mb-3 uppercase">어디 근처에서 볼까?</p>
        <input type="text" id="search-location" placeholder="예: 강남역, 홍대 등" class="w-full p-4 border-2 border-[#F3EADA] rounded-2xl mb-6 text-center focus:outline-none">
        <button class="btn-primary" onclick="searchPlaces()">맛집 검색하기 ✨</button>
    </div>

    <!-- 진짜 장소 투표 -->
    <div id="page-vote" class="page">
        <h2 class="jua text-2xl mb-4">장소 정하기! 📍</h2>
        <div id="map"></div>
        <div id="place-list" class="flex-1 overflow-y-auto pr-1"></div>
        <button class="btn-primary" onclick="finishVote()">최종 투표 마감! 🎫</button>
    </div>

    <div id="page-ticket" class="page items-center justify-center">
        <div class="bg-white rounded-[40px] shadow-2xl w-full p-10 text-center border-2 border-[#F3EADA]">
            <h2 class="jua text-3xl text-[#3FAE85] mb-6">모임 티켓 🎫</h2>
            <div id="ticket-info" class="space-y-4 jua"></div>
        </div>
        <button class="btn-primary mt-10" onclick="location.href='/'">처음으로</button>
    </div>
</div>

<script>
    // Firebase 및 상태 변수
    const firebaseConfig = {
        apiKey: "AIzaSyBqrEr1J2isB6NpoK_ONxOgmyl_cvNAnVs",
        authDomain: "moyeora-75ccf.firebaseapp.com",
        projectId: "moyeora-75ccf",
        storageBucket: "moyeora-75ccf.firebasestorage.app",
        messagingSenderId: "740093064639",
        appId: "1:740093064639:web:bd5326613a98aa2ea9dd0a",
        measurementId: "G-ZCEJ9CPWQV"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let myRoomId = new URLSearchParams(window.location.search).get('room');
    let isAdmin = !myRoomId; // 방 주인이면 true
    let viewYear = new Date().getFullYear();
    let viewMonth = new Date().getMonth();
    let myInfo = { name: "", emoji: "🐱", color: "#FFE0C7" };
    let mySelection = { dates: [], times: [], menu: "", place: "", address: "" };

    // 페이지 이동 & 캘린더 등 초기화 로직
    function goToPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        const target = document.getElementById('page-' + id);
        if(target) target.classList.add('active');
        if(id === 'datetime') renderCalendar();
    }

    async function handleEntry() {
        myInfo.name = document.getElementById('user-name').value || "말랑이";
        if (!myRoomId) {
            myRoomId = Math.random().toString(36).substring(2, 8).toUpperCase();
            await db.collection("rooms").doc(myRoomId).set({ 
                status: 'date_voting', 
                participants: [myInfo],
                admin: myInfo.name 
            });
            window.history.pushState({}, '', `?room=${myRoomId}`);
        } else {
            await db.collection("rooms").doc(myRoomId).update({ participants: firebase.firestore.FieldValue.arrayUnion(myInfo) });
        }
        startRealtimeMonitoring();
        goToPage('datetime');
    }

    function startRealtimeMonitoring() {
        db.collection("rooms").doc(myRoomId).onSnapshot((doc) => {
            const data = doc.data();
            if(!data) return;

            // 참여자 목록 갱신
            const listDiv = document.getElementById('member-list');
            listDiv.innerHTML = data.participants.map(p => `<div class="flex flex-col items-center"><div class="w-12 h-12 rounded-full flex items-center justify-center text-2xl shadow-sm mb-1" style="background:${p.color}">${p.emoji}</div><span class="text-[9px] font-bold">${p.name}</span></div>`).join('');

            // 방장 권한 체크 (확정 버튼)
            if(data.admin === myInfo.name) document.getElementById('admin-controls').classList.remove('hidden');

            // Phase 전환 체크 (날짜 투표 완료 -> 메뉴 선택)
            if(data.status === 'place_voting') {
                document.getElementById('confirmed-time-display').innerText = data.finalDate;
                goToPage('menu');
            }

            // 최종 마감 체크
            if(data.status === 'finished') {
                document.getElementById('ticket-info').innerHTML = `<div>일시: ${data.finalDate}</div><div class="text-orange-400">장소: ${data.finalPlace}</div><div class="text-[10px] text-gray-400">${data.finalAddr}</div>`;
                goToPage('ticket');
            }
        });
    }

    // 캘린더 & 시간 선택 (기존과 동일하되 다듬음)
    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        document.getElementById('calendar-month').innerText = `${viewYear}년 ${viewMonth + 1}월`;
        grid.innerHTML = "";
        const firstDay = new Date(viewYear, viewMonth, 1).getDay();
        const lastDate = new Date(viewYear, viewMonth + 1, 0).getDate();
        for(let i=0; i<firstDay; i++) grid.innerHTML += `<div></div>`;
        for(let d=1; d<=lastDate; d++) {
            const dateStr = `${viewYear}-${viewMonth+1}-${d}`;
            const cell = document.createElement('div');
            cell.className = "date-cell" + (mySelection.dates.includes(dateStr) ? " active-date" : "");
            cell.innerText = d;
            cell.onclick = () => {
                if(mySelection.dates.includes(dateStr)) mySelection.dates = mySelection.dates.filter(v => v !== dateStr);
                else mySelection.dates.push(dateStr);
                renderCalendar();
            };
            grid.appendChild(cell);
        }
    }
    function changeMonth(s) { viewMonth+=s; if(viewMonth<0){viewMonth=11;viewYear--;} if(viewMonth>11){viewMonth=0;viewYear++;} renderCalendar(); }
    function toggleTimeCategory(cat) {
        document.querySelectorAll('#page-datetime .selectable').forEach(b => b.classList.remove('selected'));
        document.getElementById('btn-'+(cat==='점심'?'lunch':cat==='오후'?'after':'dinner')).classList.add('selected');
        const area = document.getElementById('detail-time-area'); area.innerHTML = "";
        const hS = cat==='점심'?11:(cat==='오후'?14:18), hE = cat==='점심'?14:(cat==='오후'?17:22);
        for(let h=hS; h<=hE; h++) {
            [`${h}:00`, `${h}:30`].forEach(t => {
                const chip = document.createElement('div');
                chip.className = "time-chip" + (mySelection.times.includes(t) ? " active-time" : "");
                chip.innerText = t;
                chip.onclick = () => {
                    if(mySelection.times.includes(t)) mySelection.times = mySelection.times.filter(v=>v!==t);
                    else mySelection.times.push(t);
                    toggleTimeCategory(cat);
                    document.getElementById('selected-summary').innerHTML = mySelection.times.map(v => `<div class="summary-chip">${v}</div>`).join('');
                };
                area.appendChild(chip);
            });
        }
    }

    // 1단계 마감: 의견 제출
    function saveDateTime() {
        if(!mySelection.dates.length || !mySelection.times.length) return alert("날짜와 시간을 선택해주세요!");
        goToPage('waiting');
    }

    // 방장의 날짜 확정 (Phase 1 -> 2)
    async function confirmDateTime() {
        const final = `${mySelection.dates[0]} (${mySelection.times.join(', ')})`;
        await db.collection("rooms").doc(myRoomId).update({
            status: 'place_voting',
            finalDate: final
        });
    }

    // 맛집 검색 및 카드 렌더링 (디테일 강화!)
    function selectMenu(el, m) {
        document.querySelectorAll('#menu-list .selectable').forEach(s => s.classList.remove('selected'));
        el.classList.add('selected'); mySelection.menu = m;
    }

    let ps = new kakao.maps.services.Places();
    let map, marker;

    function searchPlaces() {
        const loc = document.getElementById('search-location').value;
        if(!mySelection.menu || !loc) return alert("메뉴와 지역을 입력하세요!");
        goToPage('vote');
        ps.keywordSearch(`${loc} ${mySelection.menu}`, (data, status) => {
            if (status === kakao.maps.services.Status.OK) displayPlaces(data);
            else alert("검색 결과가 없어요!");
        });
    }

    function displayPlaces(places) {
        const listEl = document.getElementById('place-list');
        listEl.innerHTML = "";
        
        // 지도 세팅
        const first = places[0];
        map = new kakao.maps.Map(document.getElementById('map'), { center: new kakao.maps.LatLng(first.y, first.x), level: 3 });
        marker = new kakao.maps.Marker({ position: map.getCenter() });
        marker.setMap(map);

        places.forEach((p) => {
            // 카테고리에 따른 이모지 썸네일
            let emoji = "🍴";
            if(p.category_name.includes("카페")) emoji = "🍰";
            else if(p.category_name.includes("일식")) emoji = "🍣";
            else if(p.category_name.includes("한식")) emoji = "🍚";
            else if(p.category_name.includes("술집")) emoji = "🍻";

            const card = document.createElement('div');
            card.className = "place-card";
            card.innerHTML = `
                <div class="place-thumb">${emoji}</div>
                <div class="flex-1">
                    <div class="font-bold text-sm mb-1">${p.place_name}</div>
                    <div class="text-[10px] text-gray-400 mb-1">${p.address_name}</div>
                    <div class="text-[9px] text-green-600 font-bold mb-2">${p.category_name}</div>
                    <a href="https://place.map.kakao.com/${p.id}" target="_blank" class="text-[9px] bg-gray-100 px-2 py-1 rounded-md text-gray-500 hover:bg-gray-200">🚩 정보/운영시간 확인</a>
                </div>
            `;
            card.onclick = () => {
                document.querySelectorAll('.place-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                mySelection.place = p.place_name;
                mySelection.address = p.address_name;
                const latLon = new kakao.maps.LatLng(p.y, p.x);
                map.panTo(latLon);
                marker.setPosition(latLon);
            };
            listEl.appendChild(card);
        });
    }

    async function finishVote() {
        if(!mySelection.place) return alert("장소를 골라주세요!");
        await db.collection("rooms").doc(myRoomId).update({
            status: 'finished',
            finalPlace: mySelection.place,
            finalAddr: mySelection.address
        });
    }
</script>

</body>
</html>
